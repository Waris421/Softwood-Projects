{% extends 'base.html' %}

{% block title %}
    Customer Master File
{% endblock title %}

{% block content %}
    <div class="{{theme.border}}">
        <form action="{% url 'marketing:exportData' %}" method="get">
            <div class="grid grid-cols-10 {{theme.justify}} {{theme.align}}">
                <div class="flex flex-col col-[1/3] items-center">
                    <span class="text-sm text-gray-500 mb-1">Search:</span>
                    <input type="text" class="{{theme.textInput}}" name="search" value="{{search}}">
                </div>
                <div class="flex flex-col col-[3/6] items-center">
                    <span class="text-sm text-gray-500 mb-1">Shipment Date:</span>
                    <div class="flex items-center" id="date-range-picker" date-rangepicker datepicker-format="yyyy-mm-dd">
                        <input id="startDate" name="startDate" type="text" class="{{theme.textInput}}" value="{{startDate}}">
                        <input id="endDate" name="endDate" type="text" class="{{theme.textInput}}" value="{{endDate}}">
                    </div>
                </div>
                <div class="flex flex-col col-[6/8] items-center">
                    <span class="text-sm text-gray-500 mb-1">Country:</span>
                    <select name="country" onchange="this.form.submit()" class="{{theme.dropdown}}"></select>
                </div>
                <div class="flex col-[8/11] btn-group {{theme.align}} justify-end">
                    <button type="submit" class="{{theme.buttonBasic}}">Filter</button>
                    <a class="{{theme.buttonBasic}}" href="{% url 'marketing:exportDataUpload' %}" role="button">Upload</a>
                </div>
            </div>
        </form>
    </div>

    <div id ="dataTable" class="mt-6">
        <table class="{{theme.table}}">
            <tr class = "{{theme.tableHead}}">
                <th scope="col">Ship Date</th>
                <th scope="col">Importer</th>
                <th scope="col">Exporter</th>
                <th scope="col">Country</th>
                <th scope="col">Quantity</th>
                <th scope="col">Price</th>
                <th scope="col">Description</th>
            </tr>
        </table>
    </div>
{% endblock content %}
