{% extends 'base.html' %}

{% block title %}
    Uploading ExportData
{% endblock title %}

{% block content %}
    <form method="POST" id="uploadForm" autocomplete="off" enctype="multipart/form-data">
        {% csrf_token %}          <!--This is to protect against CSRF attacks-->
        <div class="{{theme.border}}">
            <div class="grid grid-cols-3 my-2 {{theme.justify}} {{theme.align}}">
                <div class="flex col-[1/3] items-center">
                    <label class="mx-2 whitespace-nowrap">Data File:&nbsp; </label>
                    <input type="file" name="exportDataFile" accept=".xlsx, .xls, .csv" class="{{theme.fileInput}}">
                </div>
                <div class="flex col-[3/4] items-center">
                    <button type="submit" class="{{theme.buttonBasic}} mx-2" >Upload</button>
                </div>
            </div>
            <div class="grid grid-cols-1 my-2 {{theme.justify}} {{theme.align}}">
                <div class="flex col-[1/2] items-center">
                    <span class="text-sm text-gray-500 mb-1">
                        Please make sure to have the following columns in the file. 
                    </span>
                    <span class="text-sm text-red-500 mb-1">
                        &nbsp;Origin, Importer, Exporter, SB Date, Quantity, Price, Currency, HSCode, Description
                    </span>
                </div>
            </div>
        </div>
    </form>

    <script>    //To show error if provided
        window.addEventListener('load', async () => {
            const errorMessage = "{{error}}";
            if (errorMessage) {
                showMessage(errorMessage, 7);
            }
        });
    </script>
{% endblock content %}
