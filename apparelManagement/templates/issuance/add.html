{% extends 'base.html' %}

{% block title %}
    Adding Inventory Issuance
{% endblock title %}

{% block content %}
    <form method="POST" id="demandForm" autocomplete="off">
        {% csrf_token %}
        <div class="{{theme.border}}">
            <div class="grid grid-cols-8 my-2 {{theme.justify}} {{theme.align}}">
                <div class="flex col-[1/2] items-center">
                    <label class="mx-2 whitespace-nowrap">Request#:&nbsp; </label>
                    <input type="number" class="{{theme.textInput}}" value="{{req.id}}" readonly>
                </div>
                <div class="flex col-[2/4] items-center">
                    <label class="mx-2 whitespace-nowrap">Department:&nbsp; </label>
                    <input type="text" class="{{theme.textInput}}" value="{{req.Department.Name}}" readonly>
                </div>
                <div class="flex col-[4/6] items-center">
                    <label class="mx-2 whitespace-nowrap">Name:&nbsp; </label>
                    <input type="text" class="{{theme.textInput}}" value="{{req.RequestBy}}" readonly>
                </div>
                <div class="flex col-[6/8] items-center">
                    <label class="mx-2 whitespace-nowrap">Comments:&nbsp; </label>
                    <input type="text" class="{{theme.textInput}}" name="Comments">
                </div>
                <div class="flex col-[8/9] items-center">
                    <button type="submit" class="{{theme.buttonBasic}}"type="button">
                        Confirm
                    </button>
                </div>
            </div>
            <div class="grid grid-cols-5 mt-4 x-3 {{theme.border}} {{theme.tableHead}}" row="0">
                <div class="flex col-[1/3] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Inventory
                    </div>
                </div>
                <div class="flex col-[3/4] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Variant
                    </div>
                </div>
                <div class="flex col-[4/5] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Work Order
                    </div>
                </div>
                <div class="flex col-[5/6] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Quantity
                    </div>
                </div>
            </div>
            {% for data in invs %}
                <div class="grid grid-cols-5 x-3 {{theme.justify}} {{theme.align}} {{theme.border}}" row="{{forloop.counter}}">
                    <div class="flex col-[1/3] {{theme.align}} {{theme.justify}}">
                        <input type="text" class="{{theme.textInput}}" value="{{data.InventoryName}}" readonly>
                    </div>
                    <div class="flex col-[3/4] {{theme.align}} {{theme.justify}}">
                        <input type="text" class="{{theme.textInput}}" value="{{data.Variant}}" readonly>
                    </div>
                    <div class="flex col-[4/5] {{theme.align}} {{theme.justify}}">
                        <input type="text" class="{{theme.textInput}}" value="{{data.WorkOrder}}" readonly>
                    </div>
                    <div class="flex col-[5/6] {{theme.align}} {{theme.justify}}">
                        <input type="text" class="{{theme.textInput}}" value="{{data.Quantity}} {{data.Unit}}" readonly>
                    </div>
                </div>
            {% endfor %}
        </div>
    </form>

    <script>    //To show error if provided
        window.addEventListener('load', async () => {
            const errorMessage = "{{message}}";
            const errorBox = document.getElementById('error')
            if (errorMessage) {
                showMessage(errorMessage);
            }
        });
    </script>
{% endblock content %}
