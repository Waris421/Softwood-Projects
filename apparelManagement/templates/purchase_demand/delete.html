{% extends 'base.html' %}

{% block title %}
    Delete {{object.id}}
{% endblock %}

{% block content %}
    <dialog id="delete_modal" class="{{theme.dialogBox}}" open>
        <div class="modal-box">
            <div class="card bg-base-100 dark:bg-neutral-800 shadow-xl p-6">
                <div class="alert alert-warning mb-6">
                    <div>
                        <h3 class="font-bold text-lg">Warning!</h3>
                        <p class="text-sm">Are you sure you want to delete this?</p>
                        <h3 class="font-bold text-lg">Demand Number: {{object.id}}</h3>
                        <h3 class="font-bold text-lg">Name: {{object.Demandee}} ({{object.Department.Name}})</h3>
                    </div>
                </div>
                <form method="POST">
                    {% csrf_token %}
                    <div class="flex btn-group {{theme.align}} justify-end ml-1">
                        <button type="submit" class="{{theme.buttonBasic}}" name="confirm" value="true">
                            Yes, I am sure
                        </button>
                        <a class="{{theme.buttonSecondary}}" role="button" href="{% url 'apparelManagement:purchaseDemand' %}">Go back</a>
                    </div>
                </form>
            </div>
        </div>
    </dialog>

    <script>    //To show error mesage to user
        function showErrorMessage() {
            const error = '{{error}}';
            if (error) {
                showMessage(error, 5);
            }
        }
    </script>

    <script>    //This code runs when the page is fully loaded.
        window.addEventListener('load', async () => {
            showErrorMessage();
        });
    </script>
{% endblock %}
