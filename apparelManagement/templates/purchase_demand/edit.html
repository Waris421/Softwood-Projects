{% extends 'base.html' %}

{% block title %}
    Purchase Demand Update
{% endblock %} 

{% block content %}
    {% csrf_token %}          <!--This is to protect against CSRF attacks-->

    <!-- The main Demand form-->
    <form method="POST" id="demandForm" autocomplete="off" class="{{theme.formHeading}}">
        <div class="{{theme.border}}">
            <div class="grid grid-cols-8 my-2 {{theme.justify}} {{theme.align}}">
                <div class="flex col-[1/2] items-center">
                    <label class="mx-2 whitespace-nowrap">PD:&nbsp; </label>
                    <input type="number" class="{{theme.textInput}}" value="{{demand.id}}" name="id" readonly>
                </div>
                <div class="flex col-[2/4] items-center">
                    <label class="mx-2 whitespace-nowrap">Deparment:&nbsp; </label>
                    <select id="id_Department" class="{{theme.dropdown}}" name="Department"> </select>
                </div>
                <div class="flex col-[4/6] items-center">
                    <label class="mx-2 whitespace-nowrap">Name:&nbsp; </label>
                    <input type="text" class="{{theme.textInput}}" value="{{demand.Demandee}}" name="Demandee">
                </div>
                <div class="flex col-[6/8] items-center">
                    <label class="mx-2 whitespace-nowrap">Date:&nbsp; </label>
                    <input value="{{demand.DemandDate|date:'d/m/Y'}}" class="{{theme.textInput}}" name="DemandDate" readonly>
                </div>
                <div class="flex col-[8/9] btn-group items-center">
                    <button class="{{theme.buttonBasic}}" onclick="submitForms()" type="button">Submit</button>
                </div>
            </div>
        </div>
    </form>
    
    <!--Inventory Table-->
    <form method="POST" id="inventoryForm" autocomplete="off">
        <div class="{{theme.border}}">
            <div class="grid grid-cols-8 mt-4 px-3 {{theme.border}} {{theme.tableHead}}" row="0">
                <div class="flex col-[1/3] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Inventory
                    </div>
                </div>
                <div class="flex col-[3/4] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Variant
                    </div>
                </div>
                <div class="flex col-[4/5] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Quantity
                    </div>
                </div>
                <div class="flex col-[5/6] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Price
                    </div>
                </div>
                <div class="flex col-[6/7] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Currency
                    </div>
                </div>
                <div class="flex col-[7/8] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Forex
                    </div>
                </div>
                <div class="flex col-[8/9] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Actions
                    </div>
                </div>
            </div>
            {% for data in inv %}
                <div class="grid grid-cols-8 x-3 {{theme.justify}} {{theme.align}} {{theme.border}}" row="{{forloop.counter}}">
                    <div hidden>
                        <input type="number" value="{{data.id}}" name="id">
                    </div>
                    <div hidden>
                        <input type="text" value="{{data.Inventory}}" name="InventoryCode">
                    </div> 
                    <div class="flex col-[1/3] {{theme.align}} {{theme.justify}}">
                        <input type="text" class="{{theme.textInput}}" name="InventoryName" value="{{data.InventoryName}}" readonly>
                        <span class="material-symbols-outlined" onclick="openInvSearch(this)">search</span>
                    </div>
                    <div class="flex col-[3/4] {{theme.align}} {{theme.justify}}">
                        <input type="text" class="{{theme.textInput}}" name="VariantCode" value="{{data.Variant}}">
                    </div>
                    <div class="flex col-[4/5] {{theme.align}} {{theme.justify}}">
                        <input type="number" class="{{theme.textInput}}" name="Quantity" value="{{data.Quantity}}">
                    </div>
                    <div class="flex col-[5/6] {{theme.align}} {{theme.justify}}">
                        <input type="number" class="{{theme.textInput}}" name="Price" value="{{data.Price}}">
                    </div>
                    <div class="flex col-[6/7] {{theme.align}} {{theme.justify}}">
                        <select class="{{theme.dropdown}}" id="id_Currency_1" name="Currency"></select>
                    </div>
                    <div class="flex col-[7/8] {{theme.align}} {{theme.justify}}">
                        <input type="number" class="{{theme.textInput}}" name="Forex" value="{{data.Forex}}">
                    </div>
                    <div class="flex col-[8/9] space-x-1 {{theme.align}} {{theme.justify}}">
                        <button class="{{theme.plusButton}}" type="button" onclick="addRow(this)">
                            <span>+</span>
                        </button>
                        <button class="{{theme.minusButton}}" type="button" onclick="removeRow(this)">
                            <span>-</span>
                        </button>
                    </div>
                </div>
            {% endfor %}
        </div>
    </form>

    <!--Inventory search dialog box-->
    <input type="checkbox" id="invSearchTableToggle" class="modal-toggle" />
    <div class="modal" id="invSearchTable">
        <div class="{{theme.dialogBox}}">
            <div class="{{theme.dialogBoxHeader}}">
                <h3 class="{{theme.dialogBoxTitle}}" id="modalLabel">
                    Inventory Cards
                </h3>
                <label for="invSearchTableToggle" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</label>
            </div>
            <div class="{{theme.dialogBoxBody}}">
                <div class="grid grid-cols-3 gap-4 mb-2 bg-gray-800 text-white p-2 rounded-md">
                    <div class="text-center font-semibold">Filter 1</div>
                    <div class="text-center font-semibold">Filter 2</div>
                    <div class="text-center font-semibold">Filter 3</div>
                </div>
                <div id="invBoxSearchContainer" class="grid grid-cols-3 gap-4 mb-4 border border-gray-300 p-2 rounded-md" onkeyup="handleSearchInput(this)">
                    <div hidden>
                        <input readonly />
                    </div>
                    <div>
                        <input type="text" placeholder="Type here" class="input input-bordered w-full" />
                    </div>
                    <div>
                        <input type="text" placeholder="Type here" class="input input-bordered w-full" />
                    </div>
                    <div>
                        <input type="text" placeholder="Type here" class="input input-bordered w-full" />
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-4 py-2 border-b border-gray-200 hover:bg-gray-100 cursor-pointer user-select-none"
                    onclick="selectInv(this)"
                    id="templateRow"
                    style="display: none;"
                >
                <div hidden>
                    <span></span>
                </div>
                <div>
                    <span class="block px-2 py-1"></span>
                </div>
                <div>
                    <span class="block px-2 py-1"></span>
                </div>
                <div>
                    <span class="block px-2 py-1"></span>
                </div>
            </div>
            <div id="inventoryListContainer"></div>
        </div>
        </div>
    </div>

    <script> //To run after page loads.
        window.addEventListener('load', async () => {
            showLoadingIcon();

            //Purchase Order dropdowns
            response = await fetch('/options/departments');
            const departments = await response.json();
            await appendOptions('id_Department', departments, "{{demand.Department}}");

            //Inventory data, that was passed as JSON from view
            const inventoryData = {{ invJson|safe }};

            //Inventory Cards dropdowns
            response = await fetch('/options/inventories');
            const inventories = await response.json();
            
            response = await fetch('/options/currencies');
            const currencies = await response.json();

            //Apply the relevant dropdowns on all rows of consumption
            for (const [index, data] of inventoryData.entries()) {
                await appendOptions(`id_Currency_${index+1}`, currencies, data.Currency);
            }

            delete response;

            hideLoadingIcon();
        });
    </script>

    <script>    //To handle inventory search box
        async function openInvSearch(source) {
            const invTableRowNum = source.parentElement.parentElement.getAttribute('row');

            const searchContainer = document.getElementById('invBoxSearchContainer');

            await applySearch(searchContainer);

            const modalLabelElement = document.getElementById('modalLabel');
            if (modalLabelElement) {
                modalLabelElement.setAttribute('data-row-number', invTableRowNum);
            }
        }

        function appendInventories(inventories) {
            const invSearchTableToggle = document.getElementById('invSearchTableToggle');

            const filterRow = document.querySelector('#invSearchTable .modal-body > div:nth-child(2)');
            const templateRow = document.getElementById('templateRow');
            const inventoryListContainer = document.getElementById('inventoryListContainer');

            inventoryListContainer.innerHTML = '';

            const filterInputs = filterRow.querySelectorAll('input[type="text"]');

            for (const inventory of inventories) {
                const newRow = templateRow.cloneNode(true);
                newRow.style.display = 'grid';
                newRow.removeAttribute('id');

                newRow.children[0].children[0].textContent = inventory.value;
                newRow.children[1].children[0].textContent = inventory.text;
                newRow.children[2].children[0].textContent = inventory.text;
                newRow.children[3].children[0].textContent = inventory.text;

                inventoryListContainer.appendChild(newRow);
            }
            
            invSearchTableToggle.checked = true;
        }

        function selectInv(source) {
            const selectedCode = source.children[0].children[0].textContent;
            const selectedName = source.children[1].children[0].textContent;

            const consTableRowNum = parseInt(source.parentElement.parentElement.parentElement.children[0].children[0].getAttribute('data-row-number'));
            
            const consTableRow = document.getElementById('inventoryForm').children[0].children[consTableRowNum];
            
            const invCodeBox = consTableRow.children[1].children[0];
            const invNameBox = consTableRow.children[2].children[0];
            
            invCodeBox.value = selectedCode;
            invNameBox.value = selectedName;

            const invSearchTableToggle = document.getElementById('invSearchTableToggle');
            invSearchTableToggle.checked = false;
        }

        //Wait for half a second after user types to avoid multiple server queries
        let searchTimeout;
        const DEBOUNCE_DELAY = 500;
        async function handleSearchInput(source) {
            // Clear any existing timeout to reset the timer
            clearTimeout(searchTimeout);

            // Set a new timeout
            searchTimeout = setTimeout(async () => {
                await applySearch(source);
            }, DEBOUNCE_DELAY);
        }

        async function applySearch(source) { 
            showLoadingIcon();           
            const columns = source.children;
            
            // Get all the search terms
            let searchTerms = [];
            for (const column of columns) {
                //Convert search term to lower case and append to the array
                searchTerms.push(column.children[0].value.toLowerCase());
            }

            let url = `{% url 'InventoryList' %}`;
            const queryString = searchTerms.map(term => `searches=${encodeURIComponent(term)}`).join('&');
            url = `${url}?${queryString}`;
            
            //Get the inventories from server
            const response = await fetch(url);
            const inventories = await response.json();
            //Remove the frist row, as that is blank
            inventories.shift();

            appendInventories(inventories);
            hideLoadingIcon();
        }
    </script>

    <script> //To send data to server
        function submitForms() {
            const allForms = document.forms;

            const demandForm = allForms['demandForm']; 
            const inventoryForm = allForms['inventoryForm'];            
            
            const demand = demandForm.elements;

            let data = {};
             
            //Prepare the data for Style Group
            let group = 'demand';
            for (const element of demand) {
                if (element.name) {
                    data[group+'_'+element.name] = element.value;
                }   
            }

            //Prepare the data for inventory Group
            data = formToTable('inventory', inventoryForm, data);
            
            submitData(data)
        }

        //Convert data to Json and send to server
        async function submitData(obj) {
            const csrf = document.querySelector('input[name="csrfmiddlewaretoken"]').value;
            
            const data = JSON.stringify(obj);
            
            //console.log (csrf);
            const response = await fetch('', {
              method: 'POST',
              body: data,
              headers: { "X-CSRFToken": csrf},
            });

            if (response.status == 200) {
                const demandNumber = await response.text();
                window.location.reload();
            } else {
                const errorMessage = await response.text();
                showMessage(errorMessage);
                return
            }
            
        }

        function formToTable(group, form, data){
            let rows = form.querySelectorAll('[row]');
            //Remove unnecesary rows
            rows = dropElements(rows);

            for (const row of rows) {
                let rowNum = row.getAttribute('row');
                let cols = row.children;
                //Remove unnecessary columns
                cols = dropElements(cols, cols.length-1, cols.length-1);

                for (const col of cols) {
                    name = col.firstElementChild.name+'_'+rowNum;
                    value = col.firstElementChild.value;
                    data[group+'_'+name] = value;               
                }
            }
            return data;
        }

        function dropElements(obj, startFrom=0, endAt=0) {
            const arr = Object.values(obj);

            arr.splice(startFrom, endAt - startFrom + 1);

            return arr;
        }
    </script>
{% endblock %}
