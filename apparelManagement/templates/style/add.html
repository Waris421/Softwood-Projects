{% extends 'base.html' %}

{% block title %}
    Style Card Addition
{% endblock %} 

{% block content %}
    {% csrf_token %}          <!--This is to protect against CSRF attacks-->
    <!-- The main style form-->
    <form method="POST" id="styleForm" autocomplete="off" class="{{theme.formHeading}}">
        <div class="{{theme.border}}">
            <div class="grid grid-cols-3 my-2 {{theme.justify}} {{theme.align}}">
                <div class="flex col-[1/2] items-center">
                    <label class="mx-2 whitespace-nowrap">Code:&nbsp; </label>
                    <input type="text" class="{{theme.textInput}}" name="StyleCode" required>
                </div>
                <div class="flex col-[2/3] items-center">
                    <label class="mx-2 whitespace-nowrap">Name:&nbsp; </label>
                    <input type="text" class="{{theme.textInput}}" name="StyleName" required>
                </div>
                <div class="flex col-[3/4] items-center">
                    <label class="mx-2 whitespace-nowrap">Notes:&nbsp; </label>
                    <input type="text" class="{{theme.textInput}}" name="Notes">
                </div>
                <div class="flex col-[1/2] items-center relative">
                    <label class="mx-2 whitespace-nowrap">Customer:&nbsp; </label>
                    <select id="id_Customer" class="{{theme.dropdown}}" name="Customer" onclick="showSearchBox(this, '/options/customers')"> </select>
                </div>
                <div class="flex col-[2/3] items-center">
                    <label class="mx-2 whitespace-nowrap">Category:&nbsp; </label>
                    <select id="id_Category" class="{{theme.dropdown}}" name="Category"> </select>
                </div>  
                <div class="flex col-[3/4] items-center">
                    <button type="button" class="{{theme.buttonBasic}} mx-2" onclick="submitForms()">Save</button>
                </div>    
            </div>
        </div>
    </form>
    
    <!-- Buttons to go to each of a style's detail table-->
    <div class="{{theme.formActions}}">
        <div class="grid grid-cols-1 my-2 {{theme.justify}} {{theme.align}}">
            <div class="flex col-[1/2] btn-group {{theme.align}} justify-end ml-1">
                <button id="btn_variantsForm" class="{{theme.buttonBasic}}" type="button" onclick="changeView('variantsForm')">Variant</button>
                <button id="btn_routeForm" class="{{theme.buttonBasic}}" type="button" onclick="changeView('routeForm')">Route</button>
            </div>
        </div>
    </div>
    
    <!-- Variants Table -->
    <form method="POST" id="variantsForm" autocomplete="off" hidden>
        <div class="{{theme.border}}">
            <div class="grid grid-cols-5 mt-4 x-3 {{theme.border}} {{theme.tableHead}}" row="0">
                <div class="flex col-[1/3] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Variant 1
                    </div>
                </div>
                <div class="flex col-[3/5] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Variant 2
                    </div>
                </div>
                <div class="flex col-[5/6] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Actions
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-5 x-3 {{theme.justify}} {{theme.align}} {{theme.border}}" row="1">
                <div class="flex col-[1/3] {{theme.align}} {{theme.justify}}">
                    <input type="text" class="{{theme.textInput}}" name="Variant1" required>
                </div>
                <div class="flex col-[3/5] {{theme.align}} {{theme.justify}}">
                    <input type="text" class="{{theme.textInput}}" name="Variant2" required>
                </div>
                <div class="flex col-[5/6] space-x-1 {{theme.align}} {{theme.justify}}">
                    <button class="{{theme.plusButton}}" type="button" onclick="addRow(this)">
                        <span>+</span>
                    </button>
                    <button class="{{theme.minusButton}}" type="button" onclick="removeRow(this)">
                        <span>-</span>
                    </button>
                </div>
            </div>
        </div>
    </form>

    <!-- Route Table -->
    <form method="POST" id="routeForm" autocomplete="off" hidden>
        <div class="{{theme.border}}">
            <div class="grid grid-cols-5 mt-4 x-3 {{theme.border}} {{theme.tableHead}}" row="0">
                <div class="flex col-[1/3] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Stage
                    </div>
                </div>
                <div class="flex col-[3/5] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Pre-Requisites
                    </div>
                </div>
                <div class="flex col-[5/6] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Actions
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-5 x-3 {{theme.justify}} {{theme.align}} {{theme.border}}" row="1">
                <div class="flex col-[1/3] {{theme.align}} {{theme.justify}}">
                    <select class="{{theme.dropdown}}" id="id_RouteType_1" name="type"></select>
                </div>
                <div class="flex col-[3/5] {{theme.align}} {{theme.justify}}">
                    <div class="dropdown w-full" inputName="PreReqs">
                        <div tabindex="0" role="button" class="{{theme.emptyButton}} w-full">
                            Select options
                        </div>
                        <ul tabindex="0" class="dropdown-content menu p-2 shadow bg-base-100 rounded-box w-full"></ul>
                    </div>
                </div>
                <div class="flex col-[5/6] space-x-1 {{theme.align}} {{theme.justify}}">
                    <button class="{{theme.plusButton}}" type="button" onclick="addRow(this, updateOptions)">
                        <span>+</span>
                    </button>
                    <button class="{{theme.minusButton}}" type="button" onclick="removeRow(this)">
                        <span>-</span>
                    </button>
                </div>
            </div>
        </div>
    </form>

    <script> //To change view based on selected button
        const formIds = ['variantsForm','routeForm'];

        function changeView(formId){
            let forms = [];

            for (let i=0;i<formIds.length;i++) {
                forms[i] = document.getElementById (formIds[i]);
                const button = document.getElementById(`btn_${formIds[i]}`);
                if (formId === formIds[i]){
                    forms[i].hidden = false;
                    button.className = `{{theme.buttonSelected}}`;
                } else {
                    forms[i].hidden = true;
                    button.className = `{{theme.buttonBasic}}`;
                }
            }
        }
    </script>
    
    <script> //To send data to server
        async function submitForms() {
            const allForms = document.forms;

            const styleForm = allForms['styleForm']; 
            const variantForm = allForms['variantsForm'];
            const routeForm = allForms['routeForm'];

            const style = styleForm.elements;

            let data = {};
             
            //Prepare the data for Style Group
            let group = 'style';
            for (const element of style) {
                if (element.name) {
                    data[group+'_'+element.name] = element.value;
                }   
            }

            //Prepare the data for variant Group
            data = formToTable('variant', variantForm, data);
            data = formToTable('route', routeForm, data);

            await submitData(data);
        }

        //Convert data to Json and send to server
        async function submitData(obj) {
            const csrf = document.querySelector('input[name="csrfmiddlewaretoken"]').value;
            
            const data = JSON.stringify(obj);
            
            try {
                const response = await fetch('add', {
                    method: 'POST',
                    body: data,
                    headers: { "X-CSRFToken": csrf},
                  });
                if (response.status == 200) {
                    const styleName = await response.text();
                    window.location.href = styleName+'/edit';
                } else {
                    const errorMessage = await response.text()
                    showMessage(errorMessage);
                }
            } catch (error) {
                alert(`Error occured. Check with administrator. Error: ${errorMessage}`);
            }
        }
    </script>

    <script>    //To update options of the route
        function updateOptions(source) {
            const rows = Array.from(source.parentElement.children);
            rows.shift();

            let stagesFromPreviousRows = [];

            rows.forEach((row) => {
                const stageElement = row.querySelector('select[name^="type"]');
                const prereqDropdownList = row.querySelector('.dropdown-content.menu');
                const dropdownButton = row.querySelector('.dropdown .btn');

                const currentSelectedPrereqs = Array.from(prereqDropdownList.querySelectorAll('input[type="checkbox"]:checked'))
                .map(checkbox => checkbox.value);

                prereqDropdownList.innerHTML = '';

                stagesFromPreviousRows.forEach(stage => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <label class="label cursor-pointer">
                            <span class="label-text">${stage}</span>
                            <input type="checkbox" name="prereqs" value="${stage}" class="checkbox" ${currentSelectedPrereqs.includes(stage) ? 'checked' : ''}>
                        </label>
                    `;
                    prereqDropdownList.appendChild(li);                    
                });
                if (stageElement.value && stageElement.value !== '-----------') {
                    stagesFromPreviousRows.push(stageElement.value);
                }
            });
        }
    </script>

    <script> //This code runs when the page elements are fully loaded.        
        window.addEventListener('load', async () => {
            showLoadingIcon();

            //Customer dropdown
            let response = await fetch('/options/customers');
            const customers = await response.json();
            const emptyRow = {"value": "","text": "-----------"};
            customers.unshift(emptyRow);
            await appendOptions('id_Customer', customers);

            //Style Categories dropdown
            response = await fetch('/options/categories');
            const categories = await response.json();
            categories.unshift(emptyRow);
            await appendOptions('id_Category', categories);

            //Production stages dropdown
            response = await fetch('/options/prodstages');
            const routeTypes = await response.json();
            routeTypes.unshift(emptyRow)
            await appendOptions(`id_RouteType_1`, routeTypes);

            changeView('variantsForm');

            hideLoadingIcon();
        });
    </script>
{% endblock %}
