{% extends 'auth/base.html' %}

{% block title %}
    Reset Your Password
{% endblock title %}

{% block content %}
    <form method="post" class="mt-16">
        {% csrf_token %}     <!--This is to protect against CSRF attacks-->
        <div class="{{theme.border}}">
            <div class="grid grid-cols-3 my-2 {{theme.justify}} {{theme.align}}">
                <div class="flex col-[1/3] items-center">
                    <label class="mx-2 whitespace-nowrap">Enter your email:&nbsp; </label>
                    <input type="email" class="{{theme.textInput}}" name="email" autocomplete="email" required>
                </div>
                <div class="flex col-[3/4] items-center">
                    <button type="submit" class="{{theme.buttonBasic}} mx-2" >Confirm</button>
                </div>
            </div>
        </div>
    </form>

    <script>
        window.addEventListener('load', () => {
            const errorMessage = '{{error}}';
            if (errorMessage) {
                showMessage(errorMessage);
            }
        });
    </script>
{% endblock content %}
