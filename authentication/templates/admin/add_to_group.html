{% extends "admin/base_site.html" %}

{% block content %}
    <p>Select the group to add the following users to:</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        
        <ul>
            {% for user in users %}
                <li>{{ user.username }} <input type="hidden" name="_selected_action" value="{{ user.pk }}"></li>
            {% endfor %}
        </ul>

        <input type="hidden" name="action" value="add_to_group_action" />
        <input type="submit" name="apply" value="Confirm Assignment" />
    </form>
{% endblock content %}
