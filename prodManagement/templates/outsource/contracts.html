{% extends 'base.html' %}

{% block title %}
    Outsource Contract
{% endblock title %}

{% block content %}
    <div class="{{theme.border}}">
        <form action="{% url 'PM:outSourceContracts' %}" method="get" autocomplete="off">
            <div class="grid grid-cols-8 {{theme.justify}} {{theme.align}}">
                <div class="flex flex-col col-[1/3] items-center relative">
                    <span class="text-sm text-gray-500 mb-1">Work Order</span>
                    <select name="workOrder" class="{{theme.dropdown}}" id="workOrder" onclick="showSearchBox(this, '/options/workorders')"></select>
                </div>
                <div class="flex flex-col col-[3/5] items-center relative">
                    <span class="text-sm text-gray-500 mb-1">Source</span>
                    <select name="source" class="{{theme.dropdown}}" id="source" onclick="showSearchBox(this, '/options/capacities')"></select>
                </div>
                <div class="flex flex-col col-[5/6] items-center relative">
                    <span class="text-sm text-gray-500 mb-1">Contract#</span>
                    <input type="number" class="{{theme.textInput}}" name="contractNumber" value="{{contractNumber}}" placeholder="">
                </div>
                <div class="flex flex-col col-[6/7] items-center relative">
                    <span class="text-sm text-gray-500 mb-1">Approval</span>
                    <select name="approval" class="{{theme.dropdown}}" onchange="this.form.submit()">
                        <option value="pending" 
                        {% if approval == 'pending' %}
                            selected
                        {% endif %}
                            >Pending</option>
                        <option value="approved"
                        {% if approval == 'approved' %}
                            selected
                        {% endif %}
                            >Approved</option>
                        <option value="rejected"
                        {% if approval == 'rejected' %}
                            selected
                        {% endif %}
                            >Rejected</option>
                    </select>
                </div>
                <div class="flex col-[7/9] btn-group {{theme.align}} justify-end ml-1">
                    <button type="submit" class="{{theme.buttonBasic}}">Search</button>
                    <a class="{{theme.buttonBasic}}" href="{% url 'PM:addoutsourceContracts' %}" role="button">Add</a>
                </div>
            </div>
        </form>
    </div>

    <div id="contractsTable" class="mt-6">
        <table class="{{theme.table}}">
            <tr class = "{{theme.tableHead}}">
                <th scope="col">Contract #</th>
                <th scope="col">Source</th>
                <th scope="col">Processes</th>
                <th scope="col">Work Orders</th>
                <th scope="col">Induction Date</th>
                <th scope="col">Closing Date</th>
            </tr>
            <tbody id="tableData" class = "{{theme.tableBody}}">
                {% for data in contracts %}
                    <tr class="{{theme.tableBodyRow}}"></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>    //To run when the page loads
        window.addEventListener('load', async () => {
            showLoadingIcon();

            let response = await fetch('/options/workorders?search={{workOrder}}');
            const workOrders = await response.json();
            await appendOptions(`workOrder`, workOrders, '{{workOrder}}');

            response = await fetch('/options/capacities');
            const sources = await response.json();
            await appendOptions('source', sources, '{{source}}');

            hideLoadingIcon();
        });
    </script>
{% endblock content %}
