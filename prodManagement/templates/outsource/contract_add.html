{% extends 'base.html' %}

{% block title %}
    Contract Addition
{% endblock title %}

{% block content %}
    {% csrf_token %}          <!--This is to protect against CSRF attacks-->
    <form method="POST" id="contractForm" autocomplete="off">
        <div class="{{theme.border}}">
            <div class="grid grid-cols-4 my-2 {{theme.justify}} {{theme.align}}">
                <div class="flex flex-col col-[1/2] items-center relative">
                    <label class="mx-2 whitespace-nowrap">Source:&nbsp; </label>
                    <select id="id_source" class="{{theme.dropdown}}" name="Source" onclick="showSearchBox(this, '/options/capacities')"></select>
                </div>
                <div class="flex flex-col col-[2/3] items-center">
                    <label class="mx-2 whitespace-nowrap">Start Date:&nbsp; </label>
                    <input id="startDate" datepicker datepicker-autohide datepicker-format="yyyy-mm-dd" type="text" class="{{theme.textInput}}" name="StartDate" placeholder="Select date">
                </div>
                <div class="flex flex-col col-[3/4] items-center">
                    <label class="mx-2 whitespace-nowrap">Closing Date:&nbsp; </label>
                    <input id="endDate" datepicker datepicker-autohide datepicker-format="yyyy-mm-dd" type="text" class="{{theme.textInput}}" name="EndDate" placeholder="Select date">
                </div>
                <div class="flex col-[4/5] items-center h-full">
                    <button type="button" class="{{theme.buttonBasic}} mx-2" onclick="submitForms()">Save</button>
                </div>
            </div>
        </div>
    </form>

    <form method="POST" id="detailsForm" autocomplete="off">
        <div class="{{theme.border}}">
            <div class="grid grid-cols-6 mt-4 x-3 {{theme.border}} {{theme.tableHead}}" row="0">
                <div class="flex col-[1/3] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Work Order
                    </div>
                </div>
                <div class="flex col-[3/5] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Operation
                    </div>
                </div>
                <div class="flex col-[5/6] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Price
                    </div>
                </div>
                <div class="flex col-[6/7] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Actions
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-6 x-3 {{theme.justify}} {{theme.align}} {{theme.border}}" row="1">
                <div class="flex col-[1/3] {{theme.align}} {{theme.justify}} relative">
                    <select id="workOrder_1" class="flex-grow {{theme.dropdown}}" name="WorkOrder" onclick="showSearchBox(this, '/options/workorders', getOperations)"></select>
                </div>
                <div class="flex col-[3/5] {{theme.align}} {{theme.justify}}">
                    <select id="id_operation_1" class="flex-grow {{theme.dropdown}}" name="Operation"></select>
                </div>
                <div class="flex col-[5/6] {{theme.align}} {{theme.justify}}">
                    <input type="number" class="{{theme.textInput}}" name="Price">
                </div>
                <div class="flex col-[6/7] space-x-1 {{theme.align}} {{theme.justify}}">
                    <button class="{{theme.plusButton}}" type="button" onclick="addRow(this)">
                        <span>+</span>
                    </button>
                    <button class="{{theme.minusButton}}" type="button" onclick="removeRow(this)">
                        <span>-</span>
                    </button>
                </div>
            </div>
        </div>
    </form>

    <script>    //To get the operations of a work order
        async function getOperations(source) {
            showLoadingIcon();

            const productionSource = document.getElementById('id_source').value;
            if(!productionSource) {
                showMessage('Please select source first');
                hideLoadingIcon();
                return ;
            }

            workOrder = source.value;

            const url = `/options/order-route?workOrder=${workOrder}&source=${productionSource}`
            const response = await fetch(url);

            if (!response.ok) {
                const errorMessage = await response.text();
                showMessage(errorMessage);
                hideLoadingIcon();
                return ;
            }
            
            const operations = await response.json();

            const dropdownId = source.parentElement.parentElement.children[1].children[0].id;
            await appendOptions(dropdownId, operations);

            hideLoadingIcon();
        }
    </script>

    <script>   //To Send data to server
        async function submitForms() {
            showLoadingIcon();

            const allForms = document.forms;

            const contractForm = allForms['contractForm']; 
            const detailsForm = allForms['detailsForm'];

            const contract = contractForm.elements;

            let data = {};

            //Prepare the data for contract Group
            let group = 'contract';
            for (const element of contract) {
                if (element.name) {
                    data[group+'_'+element.name] = element.value;
                }   
            }

            //Prepare the data for details Group
            data = formToTable('details', detailsForm, data);

            await submitData(data);
;
            hideLoadingIcon();
        }

        //Convert data to Json and send to server
        async function submitData(obj) {
            const csrf = document.querySelector('input[name="csrfmiddlewaretoken"]').value;

            const data = JSON.stringify(obj);

            const response = await fetch('', {
              method: 'POST',
              body: data,
              headers: { "X-CSRFToken": csrf},
            });

            if (!response.ok) {
                const errorMessage = await response.text();
                showMessage(errorMessage);
                return ;
            }

            const contractNumber = await response.text();
            window.location.href = `/productivity/outsource-contract/${contractNumber}/edit`;
        }
    </script>
{% endblock content %}
