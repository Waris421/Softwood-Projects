{% extends 'base.html' %}

{% block title %}
    Defined Capacities
{% endblock title %}

{% block content %}
    <!-- The main filter form-->
    <div class="{{theme.border}} {{theme.formHeading}}">
        <form action="{% url 'planning:capacity' %}" method="get">
            <div class="grid grid-cols-3 my-2 {{theme.justify}} {{theme.align}}">
                <div class="flex flex-col col-[1/2] items-center">
                    <span class="text-sm text-gray-500 mb-1">Search:</span>
                    <input type="text" class="{{theme.textInput}}" name="search" value="{{search}}">
                </div>
                <div class="flex flex-col col-[2/3] items-center">
                    <span class="text-sm text-gray-500 mb-1">Min Capacity:</span>
                    <input type="range" id="capacitySlider" name="minCapacity" min="{{capacityLowest}}" max="{{capacityHighest}}" value="{{minCapacity}}" class="w-80 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer range-xl dark:bg-gray-700"/>
                </div>
                <div class="flex col-[3/4] btn-group {{theme.align}} justify-end ml-1">
                    <button type="submit" class="{{theme.buttonBasic}}">Search</button>
                    <button type="button" class="{{theme.buttonSecondary}}" onclick="submitForms()">Save</button>
                </div>
            </div>
        </form>
    </div>

    {% csrf_token %}          <!--This is to protect against CSRF attacks-->
    <!-- Capacity Table -->
    <form method="POST" id="capacityForm" autocomplete="off">
        <div class="{{theme.border}}">
            <div class="grid grid-cols-5 mt-4 x-3 {{theme.border}} {{theme.tableHead}}" row="0">
                <div class="flex col-[1/3] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Source
                    </div>
                </div>
                <div class="flex col-[3/5] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Capacity
                    </div>
                </div>
                <div class="flex col-[5/6] {{theme.align}} {{theme.justify}}">
                    <div class="{{theme.primaryHeading}} {{theme.textJustify}}">
                        Actions
                    </div>
                </div>
            </div>
            {% for data in capacities %}
                <div class="grid grid-cols-5 x-3 {{theme.justify}} {{theme.align}} {{theme.border}}" row="{{forloop.counter}}">
                    <div>
                        <input type="text" class="{{theme.textInput}}" value="{{data.id}}" name="id" hidden> 
                    </div>
                    <div class="flex col-[1/3] {{theme.align}} {{theme.justify}}">
                        <select class="{{theme.dropdown}}" id="id_Source_{{forloop.counter}}" name="Source" required></select>
                    </div>
                    <div class="flex col-[3/5] {{theme.align}} {{theme.justify}}">
                        <input type="number" step="any" class="{{theme.textInput}}" value="{{data.Capacity}}" name="Capacity" required>
                    </div>
                    <div class="flex col-[5/6] space-x-1 {{theme.align}} {{theme.justify}}">
                        <button class="{{theme.plusButton}}" type="button" onclick="addRow(this)">
                            <span>+</span>
                        </button>
                        <button class="{{theme.minusButton}}" type="button" onclick="removeRow(this)">
                            <span>-</span>
                        </button>
                    </div>
                </div>
            {% endfor %}                
        </div>
    </form>

    <script>    //This code runs when the page is fully loaded.
        window.addEventListener('load', async () => {
            showLoadingIcon();
            let response = await fetch(`/options/departments`);
            const departments = await response.json()            
            
            response = await fetch(`/options/suppliers?showAll=true`);
            const suppliers = await response.json();

            const combinedArray = [...departments, ...suppliers];

            const subDepartments = {{subDepartments | safe}};
            subDepartments.forEach(item => {
                combinedArray.push({
                    'text': item.FullName,
                    'value': item.Name,
                });
            });

            const capacitiesData = {{capacitiesJson | safe}};
            for (const [index, data] of capacitiesData.entries()) {
                await appendOptions(`id_Source_${index+1}`, combinedArray, data.Source);
            }

            hideLoadingIcon();
        });
    </script>

    <script>    //To send data to server
        async function submitForms() {
            showLoadingIcon();

            //Get all the forms in the page
            const allForms = document.forms;

            const capacityForm = allForms['capacityForm']; 

            if (!capacityForm.checkValidity()) {
                showMessage('Some required fields are missing', 5, `{{theme.errorBox}}`);
                hideLoadingIcon();
                return ;
            }

            const data = formToTable('capacity', capacityForm, {});

            const response = await submitData(data);

            if (response.ok) {
                showMessage('Saved Successfully', 3, `{{theme.successBox}}`);
            } else {
                const errorMessage = await response.text();
                showMessage(errorMessage, 5, `{{theme.errorBox}}`);
            }

            hideLoadingIcon();
        }

        async function submitData(obj) {
            const csrf = document.querySelector('input[name="csrfmiddlewaretoken"]').value;

            const data = JSON.stringify(obj);

            const response = await fetch('', {
              method: 'POST',
              body: data,
              headers: { "X-CSRFToken": csrf},
            });

            return response;
        }
    </script>
{% endblock content %}
